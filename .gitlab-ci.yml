# ============================================================
# 🚀 CI/CD cho React (Vite + Vitest)
# Triển khai tự động từ nhánh features/Implementation_Login
# ============================================================

stages:
  - install
  - test
  - build
  - deploy

variables:
  NODE_ENV: 'production'

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - node_modules/
    - .vite/
    - dist/
  policy: pull-push

# ===============================
# 1️⃣ Cài dependencies
# ===============================
install_dependencies:
  stage: install
  image: node:20
  script:
    - echo "📦 Installing dependencies..."
    - npm ci
  artifacts:
    paths:
      - node_modules/
    expire_in: 1h

# ===============================
# 2️⃣ Chạy test (Vitest)
# ===============================
test:
  stage: test
  image: node:20
  script:
    - echo "🧪 Running tests..."
    - npm run test:ci || npm run test -- --run
  artifacts:
    when: always
    reports:
      junit: reports/junit.xml
    expire_in: 1 week

# ===============================
# 3️⃣ Build Vite app
# ===============================
build:
  stage: build
  image: node:20
  script:
    - echo "🏗️ Building app..."
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

# ===============================
# 4️⃣ Deploy lên GitLab Pages
# ===============================
pages:
  stage: deploy
  image: node:20
  script:
    - echo "🚀 Deploying to GitLab Pages..."
    - mkdir .public
    - cp -r dist/* .public/
  artifacts:
    paths:
      - .public
  rules:
    - if: '$CI_COMMIT_BRANCH == "features/Implementation_Login"'
      when: always
  environment:
    name: implementation_login
    url: https://$CI_PROJECT_NAMESPACE.gitlab.io/$CI_PROJECT_NAME/implementation-login/
